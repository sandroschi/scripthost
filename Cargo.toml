[package]
name = "scripthost"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version= "1.0.104", features = ["backtrace"] }
chrono = "0.4.45"
encoding_rs = "0.8.44"
mlua = { version = "0.12.2", features = ["anyhow", "lua54", "vendored"] }
odbc-api = "30.1.0"
serde = { version = "1.0.229", features = ["derive"] }
suppaftp = "12.2.1"
toml = "1.2.1"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter","tracing-log"] }
walkdir = "2.5.0"
zip = "9.5.1"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.5"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
